services:
  postgres:
    image: postgres:16-alpine
    container_name: gstplatform-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gstplatform
    ports:
      - "5432:5432"
    volumes:
      - gstplatform_pgdata:/var/lib/postgresql/data

volumes:
  gstplatform_pgdata:
